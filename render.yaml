# Blueprint de Render para el backend (configura las variables en el dashboard)
services:
  - type: web
    name: manga-reader-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /api/health
    autoDeploy: false   # el deploy lo dispara GitHub Actions tras pasar los tests
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
