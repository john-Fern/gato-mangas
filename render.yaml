# Blueprint de Render para el backend (configura las variables en el dashboard)
services:
  - type: web
    name: gato-mangas-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    autoDeploy: false   # el deploy lo dispara GitHub Actions tras pasar los tests
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
