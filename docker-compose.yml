# Desarrollo local: Postgres (con la migración aplicada) + backend
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: manga
    ports: ["5432:5432"]
    volumes:
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/manga
    ports: ["8000:8000"]
    depends_on: [db]
